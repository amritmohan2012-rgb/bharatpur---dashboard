:root{
  --amber:#F7B133; --peach:#FCE5CD; --cream:#FEFAF7; --peach2:rgba(252,229,205,.17);
  --ink:#434343; --ink2:#666666; --mute:#8C8C8C; --rule:#E6E0D9; --paper:#FFFFFF;
  --pos:#2F9E63; --neg:#C94B4B; --blue:#2F6FED; --amber-ink:#9A6400;
  --font:'Roboto','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
}
*{box-sizing:border-box;font-style:normal!important}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--ink);font:400 14px/1.5 var(--font);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
svg text{font-family:var(--font)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:1400px;margin:0 auto;padding:0 28px}
/* masthead */
.mast{border-bottom:3px solid var(--amber);background:#fff}
.mast .wrap{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-top:18px;padding-bottom:14px}
.mast h1{margin:0;font:700 28px/1.15 var(--font);letter-spacing:-.01em}
.mast .sub{margin:4px 0 0;color:var(--ink2)}
.mast img{height:58px;width:auto;display:block;flex:none}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--rule);position:sticky;top:0;background:#fff;z-index:30;padding-top:env(safe-area-inset-top,0px)}
.tabs button{appearance:none;background:none;border:0;border-bottom:3px solid transparent;padding:13px 18px 11px;cursor:pointer;font-weight:500;color:var(--ink2);white-space:nowrap;margin-bottom:-1px}
.tabs button:hover{background:var(--cream)}
.tabs button[aria-selected=true]{border-bottom-color:var(--amber);color:var(--ink);font-weight:700}
section.view{display:none;padding:24px 0 60px}
section.view.on{display:block}
.head{display:grid;grid-template-columns:1fr auto;gap:8px 28px;align-items:end;margin-bottom:16px}
.head h2{margin:0;font:700 24px/1.2 var(--font)}
.headline{grid-column:1/-1;margin:0;font-size:15.5px;color:var(--ink2);max-width:100ch}
.headline b{color:var(--ink);font-weight:700}
.asof{font-size:12px;color:var(--mute);margin-top:2px}
/* controls */
.controls{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
.ctl{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--mute);font-weight:500;text-transform:uppercase;letter-spacing:.03em}
.ctl select,.ctl input[type=search],.ctl input[type=number],.ctl input[type=date]{border:1px solid var(--rule);background:#fff;padding:7px 10px;border-radius:4px;min-width:130px;font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:4px;overflow:hidden;background:#fff}
.seg button{appearance:none;background:#fff;border:0;border-right:1px solid var(--ink);padding:7px 13px;cursor:pointer;font-size:13px;font-weight:500}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--amber);color:var(--ink);font-weight:700}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{appearance:none;color:var(--ink);border:1px solid var(--rule);background:#fff;border-radius:16px;padding:5px 13px;cursor:pointer;font-size:13px}
.pill[aria-pressed=true]{background:var(--amber);border-color:var(--amber);font-weight:700}
.btn{appearance:none;border:1px solid var(--ink);background:#fff;padding:7px 13px;border-radius:4px;cursor:pointer;font-size:13px;font-weight:500}
.btn:hover{background:var(--cream)}
.sub-tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin:0 0 18px}
.sub-tabs button{appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px 8px;cursor:pointer;font-weight:500;color:var(--ink2);margin-bottom:-1px}
.sub-tabs button[aria-selected=true]{border-bottom-color:var(--amber);color:var(--ink);font-weight:700}
/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);margin:14px 0 22px}
.kpi{padding:13px 14px 11px 0;margin-right:14px;border-right:1px solid var(--rule)}
.kpi:last-child{border-right:0}
.kpi .v{font:700 26px/1.1 var(--font);letter-spacing:-.01em}
.kpi .l{font-size:12px;color:var(--mute);margin-top:3px}
.kpi .d{font-size:12px;margin-top:2px;font-weight:500;color:var(--ink2)}
.pos{color:var(--pos)!important} .neg{color:var(--neg)!important}
/* blocks */
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:26px}
.grid2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px}
.blk{margin-bottom:26px;min-width:0}
.blk>h3{margin:0 0 3px;font:700 15px/1.3 var(--font)}
.blk>.note{margin:0 0 10px;color:var(--mute);font-size:12.5px}
.panel{background:var(--cream);border:1px solid var(--rule);border-radius:4px;padding:14px 16px}
/* bars */
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr 84px;gap:10px;align-items:center;font-size:12.5px}
.bar .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{height:14px;background:#F3EFEA;position:relative}
.bar .fl{position:absolute;left:0;top:0;bottom:0;background:var(--amber)}
.bar .vl{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.bar.click{cursor:pointer}.bar.click:hover .lb{text-decoration:underline}
/* tables */
.tw{overflow:auto;border-top:1px solid var(--ink);max-height:560px}
table.t{border-collapse:collapse;width:100%;font-size:12.5px}
table.t th{position:sticky;top:0;background:#fff;text-align:left;font-weight:700;padding:8px 10px;border-bottom:1px solid var(--ink);white-space:nowrap;cursor:pointer;user-select:none;z-index:1}
table.t th.num,table.t td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t td{padding:7px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
table.t tr.sel td{background:var(--cream)}
table.t tbody tr:hover td{background:var(--cream)}
table.t th .ar{color:var(--amber-ink);margin-left:3px}
table.plain th{cursor:default}
.nw{white-space:nowrap}
small.m{color:var(--mute);font-size:11.5px}
.chip{display:inline-block;padding:1px 9px;border-radius:10px;font-size:11.5px;border:1px solid var(--rule);background:#fff;white-space:nowrap;font-weight:500}
.chip.on{background:var(--amber);border-color:var(--amber);font-weight:700}
.chip.mm{background:var(--peach);border-color:var(--amber);color:var(--ink);font-weight:700}
.chip.dk{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.red{border-color:var(--neg);color:var(--neg)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;border:1px solid var(--ink)}
/* maps */
.mapbox{position:relative;border:1px solid var(--ink);background:var(--cream);overflow:hidden}
.mapbox svg{display:block;width:100%;cursor:grab}
.mapbtn{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px}
.mapbtn button{width:30px;height:30px;border:1px solid var(--ink);background:#fff;cursor:pointer;font-size:16px;line-height:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:6px 9px;border-radius:3px;max-width:260px;display:none;z-index:5;line-height:1.35}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink2);margin:8px 0 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border:1px solid var(--ink);display:inline-block}
/* attendance */
.cal{overflow-x:auto;padding-bottom:6px}
.calin{min-width:1000px}
.calrow{display:flex;align-items:center;margin-bottom:6px}
.calrow .nm{width:176px;background:#fff;flex:none;font-weight:700;font-size:13px;padding-right:10px}
.calrow .nm small{display:block;color:var(--mute);font-weight:400;font-size:11.5px}
.cell{flex:1 1 0;min-width:17px;max-width:32px;height:32px;margin-right:3px;border:1px solid transparent;display:flex;align-items:center;justify-content:center;font-size:10.5px;cursor:pointer;appearance:none;padding:0;background:#fff;color:var(--ink)}
.cell.P{background:var(--amber);border-color:var(--ink)}
.cell.HD{background:linear-gradient(90deg,var(--amber) 50%,#fff 50%);border-color:var(--ink)}
.cell.WS{background:var(--ink);color:#fff;border-color:var(--ink)}
.cell.H{background:#EFEDE9;color:#999;border-color:#EFEDE9;cursor:default}
.cell.A{background:#fff;border:1.5px solid var(--neg);color:var(--neg);font-weight:700}
.cell.N{background:repeating-linear-gradient(135deg,#fff 0 4px,#E9E5DF 4px 6px);border-color:#E9E5DF;cursor:default}
.cell.sel{outline:3px solid var(--ink);outline-offset:1px}
.calhead{display:flex;margin-left:176px;margin-bottom:3px}
.calhead span{flex:1 1 0;min-width:17px;max-width:32px;margin-right:3px;text-align:center;font-size:10px;color:var(--mute)}
.calhead span.sun{color:var(--neg)}
.tl{border-left:2px solid var(--amber);margin-left:5px;padding-left:14px}
.tl .it{position:relative;padding:0 0 10px}
.tl .it::before{content:"";position:absolute;left:-21px;top:5px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--ink)}
.tl .it small{color:var(--mute)}
/* profile / cards */
.profile{border-top:3px solid var(--amber);padding-top:10px}
.profile h4{margin:0;font:700 17px/1.2 var(--font)}
.profile .rl{font-size:12px;color:var(--mute);margin-bottom:8px}
.profile dl{display:grid;grid-template-columns:1fr auto;gap:4px 10px;margin:0;font-size:13px}

MQ.addEventListener('change',()=>TBL.forEach(r=>{if(r.host.isConnected)r.draw();}));
function table(host,columns,rows,{sort,dir=-1,onRow,sel,max}={}){
  let sk=sort||columns[0].k, sd=dir, shown=0;
  const val=(c,x)=>c.v?c.v(x):x[c.k];
  const sorted=()=>{const col=columns.find(c=>c.k===sk)||columns[0];return [...rows].sort((a,b)=>{const x=val(col,a),y=val(col,b);return (typeof x==='string'?x.localeCompare(y):(x||0)-(y||0))*sd;});};
  function drawDesk(){
    const r=sorted(),sh=max?r.slice(0,max):r;
    host.innerHTML=`<div class="tw"><table class="t"><thead><tr>${columns.map(c=>`<th class="${c.num?'num':''}" data-k="${c.k}">${esc(c.h)}${c.k===sk?`<span class="ar">${sd>0?'▲':'▼'}</span>`:''}</th>`).join('')}</tr></thead><tbody>${
      sh.map(x=>`<tr data-i="${rows.indexOf(x)}" class="${sel&&sel(x)?'sel':''}">${columns.map(c=>`<td class="${c.num?'num':''}">${c.f?c.f(x):esc(x[c.k])}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${columns.length}"><div class="empty">Nothing matches these filters.</div></td></tr>`}</tbody></table></div>`;
    $$('th',host).forEach(th=>th.onclick=()=>{const k=th.dataset.k; if(k===sk)sd=-sd; else{sk=k;sd=columns.find(c=>c.k===k).num?-1:1;} draw();});
    if(onRow)$$('tbody tr',host).forEach(tr=>tr.onclick=()=>{ if(tr.dataset.i!=null)onRow(rows[+tr.dataset.i]);});
  }
  function drawMob(more){
    const r=sorted(),PS=40; shown=more?shown+PS:Math.max(PS,shown); const sh=r.slice(0,shown);
    const tcol=columns.find(c=>c.t)||columns[0], rest=columns.filter(c=>c!==tcol&&c.h&&!c.hm);
    const tools=rows.length>1;
    host.innerHTML=`<div class="rcs">${tools?`<div class="rc-tools"><label>Sort by<select>${columns.filter(c=>c.h).map(c=>`<option value="${c.k}" ${c.k===sk?'selected':''}>${esc(c.h)}</option>`).join('')}</select></label><button class="btn" aria-label="Reverse sort order">${sd>0?'▲ Low first':'▼ High first'}</button></div>`:''}`+
      (sh.map(x=>`<div class="rc ${onRow?'click':''} ${sel&&sel(x)?'sel':''}" data-i="${rows.indexOf(x)}"><div class="rc-h">${tcol.f?tcol.f(x):esc(x[tcol.k])}</div><div class="rc-g">${rest.map(c=>`<div class="${c.wide?'full':''}">${esc(c.h)}<b>${c.f?c.f(x):esc(x[c.k])}</b></div>`).join('')}</div></div>`).join('')||'<div class="empty">Nothing matches these filters.</div>')+
      (r.length>shown?`<button class="btn more">Show more (${r.length-shown} left)</button>`:'')+'</div>';
    if(tools){$('select',host).onchange=e=>{sk=e.target.value;sd=columns.find(c=>c.k===sk).num?-1:1;shown=0;drawMob();};
    $('.rc-tools .btn',host).onclick=()=>{sd=-sd;drawMob();};}
    const mb=$('.more',host);if(mb)mb.onclick=()=>drawMob(true);
    if(onRow)$$('.rc',host).forEach(el=>el.onclick=()=>onRow(rows[+el.dataset.i]));
  }
  function draw(){ if(MQ.matches)drawMob(); else drawDesk(); }
  const prev=TBL.findIndex(t=>t.host===host); const rec={host,draw}; if(prev>=0)TBL[prev]=rec; else TBL.push(rec);
  draw(); return {redraw:draw};
}
function kpis(items){return '<div class="kpis">'+items.map(k=>`<div class="kpi"><div class="v">${k.v}</div><div class="l">${k.l}</div>${k.d?`<div class="d ${k.dc||''}">${k.d}</div>`:''}</div>`).join('')+'</div>';}
const selectHTML=(id,label,opts,val)=>`<label class="ctl">${label}<select id="${id}">${opts.map(o=>{const v=Array.isArray(o)?o[0]:o,t=Array.isArray(o)?o[1]:o;return `<option value="${esc(v)}" ${v==val?'selected':''}>${esc(t)}</option>`}).join('')}</select></label>`;

/* ====================== map engine (self-contained SVG, no tiles) ====================== */
function MapView(host,{height=470,onTip}={}){
  const NS='http://www.w3.org/2000/svg';
  host.classList.add('mapbox');
  host.innerHTML='<div class="mapbtn"><button aria-label="Zoom in" data-z="1.5">+</button><button aria-label="Zoom out" data-z="0.67">−</button><button aria-label="Reset view" data-z="0" style="font-size:12px">⟲</button></div><div class="tip"></div>';
  const svg=document.createElementNS(NS,'svg'); host.prepend(svg); const tip=$('.tip',host);
  let data={ctx:[],lines:[],pts:[]},P=null,k=1,tx=0,ty=0,W=0,H=height;const coarse=matchMedia('(pointer:coarse)').matches;let unlocked=false;svg.style.touchAction=coarse?'pan-y':'none';
  function project(){
    W=host.clientWidth||800; H=W<600?Math.min(height,380):height; svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.setAttribute('height',H);
    const fit=(data.fit&&data.fit.length?data.fit:data.pts.map(p=>[p.la,p.lo]).concat(data.lines.flatMap(l=>l.pts))).filter(p=>p&&p[0]!=null);
    const base=fit.length?fit:data.ctx; if(!base.length){P=null;return;}
    let la0=Math.min(...base.map(p=>p[0])),la1=Math.max(...base.map(p=>p[0])),lo0=Math.min(...base.map(p=>p[1])),lo1=Math.max(...base.map(p=>p[1]));
    if(la1-la0<.02){la0-=.01;la1+=.01} if(lo1-lo0<.02){lo0-=.01;lo1+=.01}
    const c=Math.cos(((la0+la1)/2)*Math.PI/180),pad=34,s=Math.min((W-2*pad)/((lo1-lo0)*c),(H-2*pad)/(la1-la0));
    const ox=(W-(lo1-lo0)*c*s)/2, oy=(H-(la1-la0)*s)/2;
    P=(la,lo)=>[ox+(lo-lo0)*c*s, oy+(la1-la)*s];
  }
  function draw(){
    if(!P){svg.innerHTML='<text x="20" y="40" fill="#8C8C8C">No locations to show for this selection.</text>';return;}
    let g=`<g transform="translate(${tx},${ty}) scale(${k})">`;
    data.ctx.forEach(p=>{const [x,y]=P(p[0],p[1]);g+=`<circle cx="${x}" cy="${y}" r="${1.6/Math.sqrt(k)}" fill="#D9D3C3"/>`;});
    data.lines.forEach(l=>{const d=l.pts.filter(p=>p[0]!=null).map(p=>P(p[0],p[1]).join(',')).join(' ');
      g+=`<polyline points="${d}" fill="none" stroke="${l.color||'#434343'}" stroke-width="${(l.w||2)/k}" ${l.dash?`stroke-dasharray="${l.dash.map(x=>x/k).join(' ')}"`:''} stroke-linejoin="round" stroke-linecap="round" opacity="${l.o||.9}"/>`;});
    data.pts.forEach((p,i)=>{ if(p.la==null)return; const [x,y]=P(p.la,p.lo),r=(p.r||5)/Math.pow(k,.6);
      g+=`<g data-i="${i}" style="cursor:${p.onclick?'pointer':'default'}"><circle cx="${x}" cy="${y}" r="${r}" fill="${p.fill||'#F7B133'}" stroke="${p.stroke||'#434343'}" stroke-width="${(p.sw||1)/Math.pow(k,.6)}" opacity="${p.o||1}"/>`+
        (p.text!=null?`<text x="${x}" y="${y+3.5/Math.pow(k,.6)}" text-anchor="middle" font-size="${10/Math.pow(k,.6)}" font-weight="600" fill="${p.tc||'#434343'}" style="pointer-events:none">${esc(p.text)}</text>`:'')+
        (p.label?`<text x="${x+r+3}" y="${y+3.5/Math.pow(k,.6)}" font-size="${10.5/Math.pow(k,.6)}" fill="#434343" style="pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:${3/Math.pow(k,.6)}">${esc(p.label)}</text>`:'')+'</g>';});
    svg.innerHTML=g+'</g>';
    $$('g[data-i]',svg).forEach(el=>{const p=data.pts[+el.dataset.i];
      el.onmousemove=e=>{if(!p.tip)return;const b=host.getBoundingClientRect();tip.innerHTML=p.tip;tip.style.display='block';tip.style.left=Math.min(e.clientX-b.left+12,b.width-200)+'px';tip.style.top=(e.clientY-b.top+12)+'px';};
      el.onmouseleave=()=>tip.style.display='none';
      if(p.onclick)el.onclick=ev=>{ev.stopPropagation();tip.style.display='none';p.onclick(p)};
      else if(p.tip)el.onclick=ev=>{ev.stopPropagation();const b=host.getBoundingClientRect();tip.innerHTML=p.tip;tip.style.display='block';tip.style.left=Math.max(4,Math.min(ev.clientX-b.left+10,b.width-220))+'px';tip.style.top=Math.max(4,ev.clientY-b.top+10)+'px';clearTimeout(tip._t);tip._t=setTimeout(()=>tip.style.display='none',4000);};});
  }
  function zoomAt(f,cx,cy){const nk=Math.max(1,Math.min(40,k*f)),r=nk/k;tx=cx-(cx-tx)*r;ty=cy-(cy-ty)*r;k=nk;draw();}
  svg.addEventListener('wheel',e=>{e.preventDefault();const b=svg.getBoundingClientRect();zoomAt(e.deltaY<0?1.25:.8,(e.clientX-b.left)*W/b.width,(e.clientY-b.top)*H/b.height);},{passive:false});
  let drag=null; svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,tx,ty};svg.setPointerCapture(e.pointerId);});
  svg.addEventListener('pointermove',e=>{if(!drag)return;const b=svg.getBoundingClientRect();tx=drag.tx+(e.clientX-drag.x)*W/b.width;ty=drag.ty+(e.clientY-drag.y)*H/b.height;
    const gg=svg.firstChild; if(gg&&gg.setAttribute)gg.setAttribute('transform',`translate(${tx},${ty}) scale(${k})`);});
  svg.addEventListener('pointerup',()=>{drag=null;});
  $$('.mapbtn button',host).forEach(b=>b.onclick=()=>{const z=+b.dataset.z;if(!z){k=1;tx=ty=0;draw();}else zoomAt(z,W/2,H/2);});
  if(coarse){const lb=document.createElement('button');lb.textContent='\u270B';lb.setAttribute('aria-label','Switch one-finger map dragging on or off');lb.title='Tap to drag the map with one finger. Tap again to scroll the page.';lb.onclick=()=>{unlocked=!unlocked;svg.style.touchAction=unlocked?'none':'pan-y';lb.style.background=unlocked?'#F7B133':'#fff';};$('.mapbtn',host).append(lb);}
  svg.addEventListener('click',()=>{tip.style.display='none'});
  new ResizeObserver(()=>{if(host.clientWidth&&Math.abs(host.clientWidth-W)>2){project();draw();}}).observe(host);
  return {set(d,{keepView=false}={}){data=Object.assign({ctx:[],lines:[],pts:[],fit:null},d);if(!keepView){k=1;tx=ty=0;}project();draw();}};
}

/* ====================== RWE SALES ====================== */
const BN=['Delivered','To be delivered','Hold','Rejected'], BCOL=['#F7B133','#9A6400','#8C8C8C','#C94B4B'];
const SMON=['Apr','May','Jun','Jul','Aug','Sep','Oct'], M0=3;
function viewSales(){
  const SD=D.sales, RW=SD.rw, L=SD.lines, root=$('#v-sales'), NL=L.length;
  const bd=d=>new Date(2026,3,1+d);
  const LM=new Int8Array(NL), LW=new Int16Array(NL);
  const LD=new Int16Array(NL);
  const lastDay=Math.round((new Date(SD.asof+'T00:00:00')-new Date(2026,3,1))/864e5);
  const S={tab:'ov',mat:'All',block:'All',cat:'All',meta:'All',mon:'All',grain:'month',meas:'val',tmode:'del',q:'',sel:null,basis:'ord'};
  /* a delivered line sits in the month it was delivered (or the month it was ordered, if the switch says so); every other status sits in its order month */
  function setBasis(){for(let i=0;i<NL;i++){const l=L[i],d=(S.basis==='del'&&l[4]===0&&l[7]>=0)?l[7]:l[2];LD[i]=d;LM[i]=bd(d).getMonth()-3;LW[i]=Math.floor((d+2)/7);}}
  setBasis();
  const mixed=()=>S.basis==='del'&&S.mon!=='All', spct=(a,b)=>mixed()?'–':pct(a,b), sp=(a,b)=>mixed()?'':' · '+pct(a,b);
  const blocks=SD.blocks, matsAll=SD.mats;
  const dstr=d=>{const x=bd(d);return x.getDate()+' '+MON[x.getMonth()];};
  root.innerHTML=`
  <div class="head"><h2>Overall Business</h2><div class="controls" id="sl-ctl"></div>
   <p class="headline" id="sl-head"></p></div>
  ${subtabs('sl-tabs',[['ov','Overview'],['blk','Blocks'],['rwe','RWEs'],['prod','Products'],['mat','MATs'],['map','Map']],S.tab)}
  <div id="sl-body"></div>
  <details class="notes"><summary>How this is calculated</summary><ul>
   <li>Source: sales order report, orders placed from ${fdn(bd(Math.min(...L.map(l=>l[2]))).toISOString().slice(0,10))} to ${fdn(SD.asof)}. Only rows where the Dummy column is <b>No</b> are used; Yes rows are removed. The latest report starts on 1 Sep, so July and August orders come from the 13 Oct report and keep the status they had then. Orders are taken for the Bharatpur district, which the report serves from the Weir, Bayana, Bharatpur and Ucchain warehouses.</li>
   <li><b>Total Orders Delivered</b> = Completed, Received Cash from OE, Delivered, and Rejected orders marked “Product delivered but not to be recorded”. <b>Orders to be Delivered</b> = Confirmed, Assign to OE, Dispatched (and Ongoing). <b>Hold</b> stays Hold. Every other Rejected order stays <b>Rejected</b>.</li>
   <li><b>Months:</b> every figure counts an order in the month it was placed. When a month is selected, the “Delivered in” box adds the value delivered in that month, using the delivery date in the report, which includes orders placed in earlier months. Rejected orders marked as delivered but not recorded carry no delivery date, so they use the date the order was last updated.</li>
   <li>Value is the line total price. The Business MAT and block of each RWE come from the Bharatpur RWE and Nandghar mapping file. Ordering accounts that are not in that file (B2B and customer accounts) show as “Not in mapping” and take the block on the order.</li>
   <li><b>Blocks tab:</b> RWEs and Sahelis mapped come from the mapping file, so the table shows every mapped RWE, including those that have not ordered. No sales targets have been set for Bharatpur, so there is no target tracking.</li></ul></details>`;
  $('#sl-ctl').innerHTML=selectHTML('sl-m','Business MAT',['All',...matsAll],S.mat)+selectHTML('sl-b','Block',['All',...blocks],S.block)+selectHTML('sl-c','Category',['All',...SD.cats],S.cat)+selectHTML('sl-mo','Month',[['All','All months'],...SMON.map((m,i)=>[String(i),m+' 2026']).slice(M0)],S.mon);
  const catOf=p=>SD.cats[SD.pcat[p]];
  function compute(){
    const A={tv:[0,0,0,0],to:[new Set(),new Set(),new Set(),new Set()],tq:0,rw:new Map(),pr:new Map(),mat:new Map(),ser:{month:new Map(),week:new Map(),day:new Map()},rset:new Set()};
    for(let i=0;i<NL;i++){const [r,o,d,p,b,q,v]=L[i],R=RW[r];
      if(S.mat!=='All'&&R.m!==S.mat)continue; if(S.block!=='All'&&R.b!==S.block)continue; if(S.cat!=='All'&&catOf(p)!==S.cat)continue;
      if(S.meta==='Meta Malls'&&!R.mm)continue; if(S.meta==='Others'&&R.mm)continue; if(S.mon!=='All'&&LM[i]!==+S.mon)continue;
      A.tv[b]+=v;A.to[b].add(o);A.tq+=q;A.rset.add(r);
      let x=A.rw.get(r);if(!x){x={v:[0,0,0,0],o:new Set(),last:-1,m:[0,0,0,0,0,0,0],mo:[0,0,0,0,0,0,0]};A.rw.set(r,x);}x.v[b]+=v;x.o.add(o);if(d>x.last)x.last=d;x.mo[LM[i]]+=v;if(b===0)x.m[LM[i]]+=v;
      let y=A.pr.get(p);if(!y){y={v:[0,0,0,0],q:0,r:new Set()};A.pr.set(p,y);}y.v[b]+=v;y.q+=q;y.r.add(r);
      let z=A.mat.get(R.m);if(!z){z={v:[0,0,0,0],o:new Set(),r:new Set()};A.mat.set(R.m,z);}z.v[b]+=v;z.o.add(o);z.r.add(r);
      [['month',LM[i]],['week',LW[i]],['day',LD[i]]].forEach(([g,k])=>{let s=A.ser[g].get(k);if(!s){s={v:[0,0,0,0],o:[new Set(),new Set(),new Set(),new Set()],r:new Set()};A.ser[g].set(k,s);}s.v[b]+=v;s.o[b].add(o);s.r.add(r);});
    }
    return A;
  }
  function targets(){const T={};Object.keys(SD.targets).forEach(k=>T[k]={d:0,p:0,r:new Set()});
    for(let i=0;i<NL;i++){if(LM[i]!==6)continue;const R=RW[L[i][0]];if(!T[R.m])continue;const b=L[i][4],v=L[i][6];if(b===0)T[R.m].d+=v;else if(b===1)T[R.m].p+=v;if(b<=1)T[R.m].r.add(L[i][0]);}return T;}
  function renderHead(A){
    const tot=sum(A.tv,x=>x),dn=A.to[0].size;
    $('#sl-head').innerHTML=A.rset.size?`<b>${inr(tot)}</b> ${(S.basis==='del'&&S.mon!=='All')?'is in this view for':'was ordered by'} <b>${A.rset.size}</b> RWEs in this view. <b>${inr(A.tv[0])}</b> ${mixed()?'':'('+pct(A.tv[0],tot)+') '}has been delivered, <b>${inr(A.tv[1])}</b> is still to be delivered, <b>${inr(A.tv[2])}</b> is on hold and <b>${inr(A.tv[3])}</b> was rejected.`:'No orders match these filters.';
  }
  function blockStats(A){
    const B={};SD.blocks.forEach(b=>B[b]={b,mapped:SD.bmap[b].rwe,ss:SD.bmap[b].ss,v:[0,0,0,0],o:[new Set(),new Set(),new Set(),new Set()],r:new Set(),mat:{}});
    for(let i=0;i<NL;i++){const [r,o,d,p,b,q,v]=L[i],R=RW[r];
      if(S.mat!=='All'&&R.m!==S.mat)continue; if(S.cat!=='All'&&catOf(p)!==S.cat)continue; if(S.mon!=='All'&&LM[i]!==+S.mon)continue;
      const x=B[R.b];if(!x)continue;x.v[b]+=v;x.o[b].add(o);x.r.add(r);const m=x.mat[R.m]||(x.mat[R.m]=[0,0,0,0]);m[b]+=v;}
    return Object.values(B);
  }
  function delBox(A,tot){
    if(S.mon==='All')return '';
    const m=+S.mon,mn=SMON[m];let dAny=0,recv=0,early=0;const nAny=new Set();
    for(let i=0;i<NL;i++){const l=L[i],R=RW[l[0]];
      if(S.mat!=='All'&&R.m!==S.mat)continue;if(S.block!=='All'&&R.b!==S.block)continue;if(S.cat!=='All'&&catOf(l[3])!==S.cat)continue;
      if(LM[i]<=m)recv+=l[6];
      if(l[4]===0&&l[7]>=0&&bd(l[7]).getMonth()-3===m){dAny+=l[6];nAny.add(l[1]);if(LM[i]<m)early+=l[6];}}
    return `<div class="blk" style="margin-top:14px"><h3>Delivered in ${mn}</h3><p class="note">The figures above count orders by the month they were placed. Deliveries made in ${mn} also include orders placed in earlier months, shown here.</p>`+
      kpis([{v:inr(A.tv[0]),l:`Delivered from ${mn} orders`,d:`${A.to[0].size} orders · ${pct(A.tv[0],tot)} of the ${inr(tot)} ordered in ${mn}`},
            {v:inr(dAny),l:`Delivered in ${mn}, from all orders received`,d:`${nAny.size} orders · ${pct(dAny,recv)} of the ${inr(recv)} received up to the end of ${mn} · of which ${inr(early)} is from orders placed in earlier months`}])+'</div>';
  }
  function tabOv(A){
    const tot=sum(A.tv,x=>x);
    const kp=[{v:inr(tot),l:(S.basis==='del'&&S.mon!=='All')?'Total in view':'Total ordered',d:num(A.to.reduce((t,x)=>t+x.size,0))+' orders'},{v:inr(A.tv[0]),l:'Total orders delivered',d:A.to[0].size+' orders'+sp(A.tv[0],tot)},{v:inr(A.tv[1]),l:'Orders to be delivered',d:A.to[1].size+' orders'},
      {v:inr(A.tv[2]),l:'Hold',d:A.to[2].size+' orders'},{v:inr(A.tv[3]),l:'Rejected',d:A.to[3].size+' orders'+sp(A.tv[3],tot)},{v:A.rset.size,l:'RWEs ordering',d:'of '+SD.blocks.reduce((t,b)=>t+SD.bmap[b].rwe,0)+' RWEs mapped'}];

    const W=win();$$('#at-m button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.month));
    const R=ML().map(m=>stats(m,W)),last=[...W].reverse().find(d=>!isHol(d))||W[W.length-1];
    $$('#at-mat button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===String(S.mat)));
    const onLast=ML().filter(m=>['P','WS','HD'].includes(status(m.id,last))).length;
    const ok=R.filter(r=>r.pr!=null).sort((a,b)=>b.pr-a.pr),lo=ok[ok.length-1],hi=ok[0];
    $('#at-head').innerHTML=R.length===1?`<b>${esc(R[0].m.name)}</b> ${onLast?'reported for work':'did not report for work'} on ${fd(last)}, the latest working day on file. Attendance over this period is <b>${R[0].pr!=null?(R[0].pr*100).toFixed(0)+'%':'–'}</b> (${R[0].P} present, ${R[0].HD} half, ${R[0].A} absent). <b>${R[0].nso}</b> workdays have no sign-out on record.`:`<b>${onLast} of ${R.length}</b> MATs reported for work on ${fd(last)}, the latest working day on file. Over this period attendance runs from <b>${lo?(lo.pr*100).toFixed(0)+'%':'–'}</b> (${esc(lo?lo.m.name:'')}) to <b>${hi?(hi.pr*100).toFixed(0)+'%':'–'}</b> (${esc(hi?hi.m.name:'')}). <b>${sum(R,r=>r.nso)}</b> workdays have no sign-out on record.`;
    const hrv=R.filter(r=>r.hr!=null),stv=R.filter(r=>r.st!=null);
    $('#at-kpi').innerHTML=kpis([{v:(sum(R,r=>r.days)).toFixed(1).replace('.0',''),l:'MAT-days worked'},{v:pct(sum(R,r=>r.P+r.HD*.5),sum(R,r=>r.den)),l:R.length===1?'Attendance':'Team attendance'},{v:sum(R,r=>r.A),l:'Absent days'},{v:sum(R,r=>r.HD),l:'Half days'},{v:sum(R,r=>r.WS),l:'Holidays worked'},
      {v:hm(stv.length?sum(stv,r=>r.st)/stv.length:null),l:'Average start time'},{v:hrv.length?(sum(hrv,r=>r.hr)/hrv.length).toFixed(1)+' h':'–',l:'Average hours a day'},{v:sum(R,r=>r.vis),l:'GPS-stamped visits'}]);
    let h='<div class="calin"><div class="calhead">'+W.map(d=>`<span class="${isHol(d)?'sun':''}">${+d.slice(8)}</span>`).join('')+'</div>';
    ML().forEach(m=>{h+=`<div class="calrow"><div class="nm"><span class="dot" style="background:${m.color}"></span>${esc(m.name)}<small>${m.role} MAT</small></div>`+W.map(d=>{const s=status(m.id,d),ck=s==='P'||s==='WS'||s==='HD';
      return `<button class="cell ${s} ${S.date===d&&(S.dm==='All'||String(S.dm)===String(m.id))?'sel':''}" ${ck?`data-m="${m.id}" data-d="${d}"`:'disabled'} title="${esc(m.name)} · ${fd(d)} (${DOW[dow(d)]}): ${LBL[s]}${LEAVE[m.id+'|'+d]?' · '+LEAVE[m.id+'|'+d]:''}">${s==='A'?'×':''}</button>`}).join('')+'</div>';});
    const calEl=$('#at-cal'),prevL=calEl.scrollLeft,firstCal=!calEl.dataset.init;calEl.innerHTML=h+`<div class="calnote">${fd(W[0])} to ${fd(W[W.length-1])}, day of month above each column</div></div>`;calEl.dataset.init=1;calEl.scrollLeft=(firstCal&&innerWidth<760)?calEl.scrollWidth:prevL;
    $$('#at-cal .cell[data-m]').forEach(c=>c.onclick=()=>{S.date=c.dataset.d;S.dm=String(S.mat)==='All'?c.dataset.m:S.mat;render();$('#at-day').scrollIntoView({behavior:'smooth',block:'start'});});
    table($('#at-tab'),[{k:'n',h:'MAT',f:r=>`<span class="nw"><span class="dot" style="background:${r.m.color}"></span><b>${esc(r.m.name)}</b></span>`,v:r=>r.m.name},{k:'pr',h:'Attendance',num:1,f:r=>r.pr==null?'–':`<b>${(r.pr*100).toFixed(0)}%</b>`,v:r=>r.pr||0},
      {k:'P',h:'Present',num:1},{k:'HD',h:'Half',num:1},{k:'A',h:'Absent',num:1,f:r=>`<span class="${r.A?'neg':''}">${r.A}</span>`},{k:'WS',h:'Holiday worked',num:1},{k:'st',h:'Avg start',num:1,f:r=>hm(r.st),v:r=>r.st||0},
      {k:'hr',h:'Avg hours',num:1,f:r=>r.hr==null?'–':r.hr.toFixed(1),v:r=>r.hr||0},{k:'nso',h:'No sign-out',num:1,f:r=>`<span class="${r.nso>3?'neg':''}">${r.nso}</span>`},{k:'vpd',h:'Visits/day',num:1,f:r=>r.vpd.toFixed(1)},{k:'vil',h:'Villages',num:1},{k:'nb',h:'Blocks',num:1}],R,{sort:'pr'});
    $('#at-hrs').innerHTML=ML().map(m=>`<div style="margin-bottom:12px">${hrsChart(m,W)}</div>`).join('');
    blockCov(W);
    renderDay(W);
  }
  segBind('at-m',v=>{S.month=v;render();});
  $('#at-mat').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.mat=b.dataset.v;S.dm=b.dataset.v;render();};
  $('#at-date').onchange=e=>{S.date=e.target.value;render();};$('#at-dm').onchange=e=>{S.dm=e.target.value;render();};
  const step=n=>{const W=win(),i=W.indexOf(S.date)+n;if(i>=0&&i<W.length){S.date=W[i];render();}};$('#at-dp').onclick=()=>step(-1);$('#at-dn').onclick=()=>step(1);
  return {show:()=>render()};
}

/* ====================== boot ====================== */
(function(){
  const V={sales:viewSales(),att:viewAtt()};
  function go(t,push){if(!V[t])t='sales';
    $$('#tabs button').forEach(b=>{const on=b.dataset.t===t;b.setAttribute('aria-selected',on);if(on){const bar=b.parentNode;bar.scrollLeft=b.offsetLeft-(bar.clientWidth-b.offsetWidth)/2;}});$$('section.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+t));
    V[t].show();if(push)history.replaceState(null,'','#'+t);window.scrollTo({top:0});}
  $('#tabs').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.t,true);};
  $('#dbg').onclick=closeDrawer;
  $('.mast .sub').innerHTML=`<span class="hide-m">Overall business and MAT attendance, block by block. </span>Sales to ${fdn(D.sales.asof)}, attendance to ${fdn(D.att_asof)}.`;
  $$('.head>.controls').forEach(c=>{if(!c.querySelector('select,input[type=search]'))return;if(c.querySelector('.seg'))return;
    const b=document.createElement('button');b.className='filt-toggle';b.setAttribute('aria-expanded','false');b.innerHTML='<span>Filters</span><span aria-hidden="true">+</span>';
    c.classList.add('fold');c.parentNode.insertBefore(b,c);
    b.onclick=()=>{const o=c.classList.toggle('open');b.setAttribute('aria-expanded',o);b.lastChild.textContent=o?'\u2212':'+';};});
  go((location.hash||'#sales').slice(1));
  window.addEventListener('hashchange',()=>go(location.hash.slice(1)));
})();


</script>
